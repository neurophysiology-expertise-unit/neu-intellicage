[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neu-intellicage"
version = "0.1.0"
description = "Reproducible loading, quality control, and analysis of IntelliCage data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Neurophysiology Expertise Unit"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
pymice = ["PyMICE>=1.2.1"]

[project.scripts]
neu-intellicage = "neu_intellicage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
